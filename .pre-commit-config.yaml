repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff
        language: system
        types: [python]
        files: '^pynbodyext/'               # only trigger in src
        args: ["check"]
        pass_filenames: true
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        files: '^pynbodyext/'               # only trigger in src
        args: ["--config-file=pyproject.toml"]
        pass_filenames: true
